[project]
name = "advanced-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gauravgulia26", email = "grvgulia007@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docling-parse>=7.22.3",
    "docling-slim[format-pdf-docling]>=2.140.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-docling>=3.0.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "tiktoken>=0.14.0",
]

[project.scripts]
advanced-rag = "advanced_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fonttools>=4.67.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "pypdf>=6.21.1",
]
